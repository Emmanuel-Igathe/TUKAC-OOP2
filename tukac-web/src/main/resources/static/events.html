<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events | TUKAC Portal</title>
  <meta name="description" content="Browse and RSVP to TUK Ability Club events."/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon"><img src="/logo.svg" alt="TUKAC Logo"/></div>
        <div><div class="brand-text">TUKAC</div><div class="brand-subtitle">Ability Club Portal</div></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <a href="/dashboard.html" class="nav-item" data-page="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="/events.html" class="nav-item" data-page="events.html"><span class="nav-icon">📅</span> Events</a>
      <a href="/finances.html" class="nav-item" data-page="finances.html"><span class="nav-icon">💰</span> Finances</a>
      <a href="/blog.html" class="nav-item" data-page="blog.html"><span class="nav-icon">✍️</span> Blog</a>
      <a href="/forum.html" class="nav-item" data-page="forum.html"><span class="nav-icon">💬</span> Forum</a>
      <a href="/about.html" class="nav-item" data-page="about.html"><span class="nav-icon">ℹ️</span> About</a>
      <a href="/profile.html" class="nav-item" data-page="profile.html"><span class="nav-icon">👤</span> My Profile</a>
      <a href="/help.html" class="nav-item" data-page="help.html"><span class="nav-icon">❓</span> Help & Support</a>
      <div id="execSection" class="hidden">
        <div class="nav-section-label">Management</div>
        <a href="/events.html" class="nav-item active" data-page="events.html"><span class="nav-icon">⚙️</span> Manage Events</a>
        <a href="/finances.html" class="nav-item" data-page="finances.html"><span class="nav-icon">⚙️</span> Manage Finances</a>
        <a href="/blog.html" class="nav-item" data-page="blog.html"><span class="nav-icon">⚙️</span> Manage Blog</a>
      </div>
      <div id="adminSection" class="hidden">
        <div class="nav-section-label">Admin</div>
        <a href="/admin.html" class="nav-item" data-page="admin.html"><span class="nav-icon">👥</span> Manage Users</a>
        <a href="/audit-logs.html" class="nav-item" data-page="audit-logs.html"><span class="nav-icon">📜</span> Audit Logs</a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info-box">
        <div class="user-avatar" id="userAvatar">?</div>
        <div><div class="user-name" id="userName">...</div><div class="user-role" id="userRole">member</div></div>
      </div>
      <button class="btn btn-danger w-full btn-sm" onclick="logout()">← Logout</button>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div>
        <div class="topbar-title">Events</div>
        <div class="topbar-subtitle">Club events and activities</div>
      </div>
      <div class="flex gap-2">
        <input type="text" id="eventSearch" class="form-control form-control-sm" placeholder="Search events..." style="width:200px;" oninput="debounceSearch()">
        <button class="btn btn-primary btn-sm hidden" id="createEventBtn" onclick="openCreateModal()">+ Create Event</button>
      </div>
    </header>

    <main class="main-content">
      <div id="pageAlert" class="alert hidden"></div>

      <div class="events-grid" id="eventsGrid">
        <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Loading events...</div>
      </div>
    </main>
  </div>
</div>

<!-- Create/Edit Event Modal -->
<div class="modal-overlay hidden" id="eventModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Create Event</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="modalAlert" class="alert hidden"></div>
    <form id="eventForm" onsubmit="handleEventSubmit(event)">
      <input type="hidden" id="editEventId"/>
      <div class="form-group">
        <label>Event Title *</label>
        <input type="text" id="evTitle" class="form-control" placeholder="e.g. Inclusion Awareness Walk" required/>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="evDesc" class="form-control" rows="3" placeholder="Describe the event..."></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="evDate" class="form-control" required/>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="evTime" class="form-control"/>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="evLocation" class="form-control" placeholder="e.g. Main Hall, TUK"/>
        </div>
        <div class="form-group">
          <label>Capacity (0 = unlimited)</label>
          <input type="number" id="evCapacity" class="form-control" value="0" min="0"/>
        </div>
      </div>
      <div class="flex gap-2" style="margin-top:8px;">
        <button type="submit" class="btn btn-primary" id="eventSubmitBtn">Create Event</button>
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  if (!requireAuth()) {}

  const user = getUser();
  const isExec = user && ['chairperson','vice-chairperson','secretary'].includes(user.role);
  let editingId = null;

  document.addEventListener('DOMContentLoaded', () => {
    initSidebar();
    if (isExec) document.getElementById('createEventBtn').classList.remove('hidden');
    loadEvents();
  });

  let searchTimeout;
  function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => loadEvents(), 500);
  }

  async function loadEvents() {
    const grid = document.getElementById('eventsGrid');
    setLoading(grid, 'Loading events...');

    const query = document.getElementById('eventSearch')?.value || '';
    const res = await api.get(`/events?search=${encodeURIComponent(query)}`);
    if (!res || !res.data.success) {
      setEmpty(grid, '📅', 'Could not load events', res?.data?.message);
      return;
    }

    const events = res.data.data;
    if (!events.length) {
      setEmpty(grid, '📅', 'No events yet', 'Check back soon for upcoming events!');
      return;
    }

    grid.innerHTML = events.map(e => `
      <div class="event-card">
        <h3>${escHtml(e.title)}</h3>
        <div class="event-meta">
          <span>📅 ${e.eventDate}${e.eventTime ? ' at ' + e.eventTime : ''}</span>
          <span>📍 ${escHtml(e.location || 'TBA')}</span>
          <span>👥 ${e.rsvpCount} RSVP${e.rsvpCount !== 1 ? 's' : ''}${e.capacity > 0 ? ' / ' + e.capacity : ''}</span>
        </div>
        ${e.description ? `<p class="event-desc">${escHtml(e.description)}</p>` : ''}
        <div class="event-footer" style="flex-direction: column; align-items: flex-start; gap: 10px;">
          <button class="btn btn-sm ${e.isRsvped ? 'btn-danger' : 'btn-primary'}" 
                  id="rsvp-btn-${e.id}"
                  style="width: 100%;"
                  onclick="toggleRsvp(${e.id}, this)">
            ${e.isRsvped ? '✓ Cancel RSVP' : '+ RSVP'}
          </button>
          ${isExec ? `
            <div class="flex gap-2 w-full" style="border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px;">
              <button class="btn btn-outline btn-sm" style="flex:1" onclick="openEditModal(${JSON.stringify(e).replace(/"/g, '&quot;')})">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" style="flex:1" onclick="deleteEvent(${e.id})">🗑 Delete</button>
            </div>` : ''}
        </div>
      </div>`).join('');
  }

  async function toggleRsvp(eventId, btn) {
    btn.disabled = true;
    const res = await api.post(`/events/${eventId}/rsvp`, {});
    btn.disabled = false;
    if (res && res.data.success) {
      await loadEvents();
    } else {
      showAlert(document.getElementById('pageAlert'), 'error', res?.data?.message || 'RSVP failed');
    }
  }

  function openCreateModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Create Event';
    document.getElementById('eventSubmitBtn').textContent = 'Create Event';
    document.getElementById('eventForm').reset();
    document.getElementById('editEventId').value = '';
    document.getElementById('eventModal').classList.remove('hidden');
  }

  function openEditModal(event) {
    editingId = event.id;
    document.getElementById('modalTitle').textContent = 'Edit Event';
    document.getElementById('eventSubmitBtn').textContent = 'Save Changes';
    document.getElementById('editEventId').value = event.id;
    document.getElementById('evTitle').value = event.title || '';
    document.getElementById('evDesc').value = event.description || '';
    document.getElementById('evDate').value = event.eventDate || '';
    document.getElementById('evTime').value = event.eventTime || '';
    document.getElementById('evLocation').value = event.location || '';
    document.getElementById('evCapacity').value = event.capacity || 0;
    document.getElementById('eventModal').classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('eventModal').classList.add('hidden');
  }

  async function handleEventSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('eventSubmitBtn');
    btn.disabled = true;

    const payload = {
      title: document.getElementById('evTitle').value.trim(),
      description: document.getElementById('evDesc').value.trim(),
      eventDate: document.getElementById('evDate').value,
      eventTime: document.getElementById('evTime').value,
      location: document.getElementById('evLocation').value.trim(),
      capacity: parseInt(document.getElementById('evCapacity').value) || 0
    };

    const isEdit = editingId !== null;
    const res = isEdit
      ? await api.put(`/events/${editingId}`, payload)
      : await api.post('/events', payload);

    btn.disabled = false;

    if (res && res.data.success) {
      closeModal();
      showAlert(document.getElementById('pageAlert'), 'success', isEdit ? 'Event updated!' : 'Event created!');
      await loadEvents();
    } else {
      showAlert(document.getElementById('modalAlert'), 'error', res?.data?.message || 'Failed to save event');
    }
  }

  async function deleteEvent(id) {
    if (!confirm('Are you sure you want to delete this event?')) return;
    const res = await api.delete(`/events/${id}`);
    if (res && res.data.success) {
      showAlert(document.getElementById('pageAlert'), 'success', 'Event deleted.');
      await loadEvents();
    } else {
      showAlert(document.getElementById('pageAlert'), 'error', 'Failed to delete event.');
    }
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
  }
</script>
</body>
</html>

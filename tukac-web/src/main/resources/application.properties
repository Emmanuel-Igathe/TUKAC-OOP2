spring.application.name=tukac-web

# SQLite datasource
spring.datasource.url=jdbc:sqlite:../tukac.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server port
server.port=8080

# Disable Spring Security default password log
logging.level.org.springframework.security=WARN
logging.level.com.tukac=INFO

# JWT secret (change in production)
jwt.secret=tukac-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000

# File upload limits (50MB for images/videos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
